name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report high-severity dependency vulnerabilities
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Check repository structure
        run: npm run check:structure

      - name: Check generator version pin
        run: npm run check:generator-version

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Run smoke tests
        run: npm run smoke

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Ensure package contains plugin assets
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          grep -F '.mcp.json' pack.log
          grep -F '.codex-plugin/' pack.log
          grep -F 'hooks/' pack.log

  parity-receipt-reproduction:
    runs-on: ubuntu-latest
    # Only run when the parity receipt files are present on the branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for committed parity receipt
        id: check-receipt
        run: |
          if [ -f docs/migration/parity-receipt.json ]; then
            echo "has_receipt=true" >> $GITHUB_OUTPUT
          else
            echo "has_receipt=false" >> $GITHUB_OUTPUT
            echo "No committed parity receipt found — skipping reproduction check."
          fi

      - name: Reproduce parity receipt
        if: steps.check-receipt.outputs.has_receipt == 'true'
        run: |
          TARGET_SHA=$(node -p "require('./docs/migration/parity-receipt.json').refs.targetSha")
          node scripts/migration/verify-clone-parity.mjs --target-ref "$TARGET_SHA" --out .parity-ci

      - name: Compare CI receipt against committed reference
        if: steps.check-receipt.outputs.has_receipt == 'true'
        run: |
          node scripts/migration/verify-receipt.mjs \
            docs/migration/parity-receipt.json \
            .parity-ci/parity-receipt.json

  standard-candidate-consumption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build extension
        run: npm run build:extension

      - name: Run standard-candidate consumption harness
        run: npm run consume:standard-candidate
